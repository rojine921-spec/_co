
name: Nand2Tetris Project 5 Tests

on:
  push:
    paths:
      - "05/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Hardware Simulator
        run: |
          git clone --depth 1 https://github.com/tcarreira/nand2tetris.git /tmp/nand2tetris
          chmod +x /tmp/nand2tetris/tools/HardwareSimulator.sh

      - name: Run Project 5 Tests
        shell: bash
        run: |
          set -euo pipefail

          for test in CPU ComputerAdd ComputerMax ComputerRect; do
            echo "Testing $test..."

            xvfb-run -a /tmp/nand2tetris/tools/HardwareSimulator.sh \
              "$PWD/05/$test.tst" > "$RUNNER_TEMP/$test.log" 2>&1 || {
                cat "$RUNNER_TEMP/$test.log"
                exit 1
              }

            cat "$RUNNER_TEMP/$test.log"

            grep -q "Comparison ended successfully" \
              "$RUNNER_TEMP/$test.log" || exit 1
          done
